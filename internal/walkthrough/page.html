<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing but this page's own style and script, and nothing fetched or
     sent: what an agent wrote is shown as text, and were that ever to fail,
     it could still do nothing. nerdr puts in the script's hash. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src '{{SCRIPT_HASH}}'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}} · walkthrough</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #e2e3e0;
  --accent: #3b5bdb; --accent-soft: #e7ecfd; --side: #8a5a00; --side-soft: #fbf0db;
  --add: #e6f4ea; --add-ink: #1a7f37; --del: #fdecec; --del-ink: #b42318;
  --mark: #fff3bf; --why: #6741d9;
  --high: #c92a2a; --medium: #d9480f; --low: #5c7cfa;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --ink: #e6e8eb; --muted: #9aa1ab; --line: #2e3238;
    --accent: #8ea6ff; --accent-soft: #232b45; --side: #f0b955; --side-soft: #3a2f1a;
    --add: #15301e; --add-ink: #6fdc8c; --del: #3a1a1a; --del-ink: #ff8b80;
    --mark: #4a4010; --why: #b197fc;
    --high: #ff6b6b; --medium: #ffa94d; --low: #91a7ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 28px 24px 80px; }
header h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 13px; }
.meta code { font-family: var(--mono); font-size: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 96px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.stat.add b { color: var(--add-ink); } .stat.del b { color: var(--del-ink); } .stat.high b { color: var(--high); }
.summary { max-width: 78ch; font-size: 16px; margin: 14px 0 26px; }
.summary p { margin: 0 0 10px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 34px 0 12px; font-weight: 600; }
.tour { display: grid; grid-template-columns: minmax(300px, 520px) minmax(0, 1fr); gap: 24px; align-items: start; }
.flowbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow: auto; position: sticky; top: 16px; max-height: calc(100vh - 32px); }
.flow { position: relative; }
.flow svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; width: 210px; min-height: 58px; padding: 8px 10px 8px 38px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; text-align: left; font: inherit; color: inherit; font-size: 13.5px; line-height: 1.3; }
.node:hover { border-color: var(--accent); }
.node .n { position: absolute; left: 9px; top: 9px; width: 21px; height: 21px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.node small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.node.side { border-style: dashed; }
.node.side .n { background: var(--side-soft); color: var(--side); }
.node.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node.seen:not(.on) { opacity: .62; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .55; }
.edge.side { stroke-dasharray: 4 3; }
.edge.on { stroke: var(--accent); opacity: 1; stroke-width: 2; }
.flowhelp { color: var(--muted); font-size: 12px; margin-top: 12px; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
.step + .step { margin-top: 18px; }
.stephead { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.badge.side { background: var(--side-soft); color: var(--side); }
.step h3 { font-size: 21px; margin: 6px 0 10px; line-height: 1.3; }
.text { max-width: 80ch; }
.text p { margin: 0 0 10px; }
.text code, .note code { font-family: var(--mono); font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.follows { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.follows a { color: var(--accent); cursor: pointer; text-decoration: none; }
.nav { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
.nav button, .toggle button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.nav button:hover:not(:disabled), .toggle button:hover { border-color: var(--accent); }
.nav button:disabled { opacity: .4; cursor: default; }
.nav .grow { flex: 1; }
.nav kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.toggle { display: inline-flex; gap: 6px; margin-left: 12px; vertical-align: middle; }
.toggle button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.code { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.codehead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 13px; }
.codehead .path { font-family: var(--mono); font-weight: 600; }
.codehead .role { color: var(--muted); }
.codehead .num { font-family: var(--mono); font-size: 12px; }
.codehead .num .a { color: var(--add-ink); } .codehead .num .d { color: var(--del-ink); }
.note { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.missing { padding: 10px 12px; color: var(--muted); font-style: italic; font-size: 13px; }
table.diff { width: 100%; border-collapse: collapse; font: 12.5px/1.5 var(--mono); tab-size: 4; }
table.diff tr.gap td { color: var(--muted); background: var(--bg); font-family: var(--sans); font-size: 12px; padding: 3px 8px; }
table.diff td { padding: 0 8px; vertical-align: top; white-space: pre-wrap; word-break: break-word; }
table.diff td.ln { width: 1%; min-width: 3.2em; color: var(--muted); text-align: right; user-select: none; opacity: .7; white-space: nowrap; }
table.diff tr.h td { color: var(--muted); background: var(--bg); padding: 2px 8px; }
table.diff tr.add td.c { background: var(--add); }
table.diff tr.del td.c { background: var(--del); }
table.diff tr.add td.s { color: var(--add-ink); } table.diff tr.del td.s { color: var(--del-ink); }
table.diff td.s { width: 1%; padding: 0 2px; user-select: none; }
table.diff tr.mark td.c { box-shadow: inset 3px 0 0 var(--accent); }
table.diff tr.mark td.ln { background: var(--mark); opacity: 1; }
table.diff tr.why td { color: var(--why); font-family: var(--sans); font-style: italic; font-size: 13px; padding: 3px 8px; white-space: normal; }
.more { padding: 6px 12px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
.risk { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--low); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
.risk.high { border-left-color: var(--high); } .risk.medium { border-left-color: var(--medium); }
.risk .lvl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.risk.high .lvl { color: var(--high); } .risk.medium .lvl { color: var(--medium); } .risk.low .lvl { color: var(--low); }
.risk details { margin-top: 8px; } .risk summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.files { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.files div { display: grid; grid-template-columns: minmax(0, 2fr) 9em minmax(0, 3fr) 7em; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.files div:first-child { border-top: 0; }
.files .path { font-family: var(--mono); overflow-wrap: anywhere; }
.files .role { color: var(--muted); }
.files .num { font-family: var(--mono); text-align: right; } .files .a { color: var(--add-ink); } .files .d { color: var(--del-ink); }
.empty { color: var(--muted); font-size: 14px; }
@media (max-width: 900px) {
  .wrap { padding: 20px 16px 60px; }
  .tour { grid-template-columns: minmax(0, 1fr); }
  .flowbox { position: static; max-height: none; }
  .files div { grid-template-columns: minmax(0, 1fr) 6em; }
  .files .role, .files .short { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="summary" id="summary"></div>

  <h2>Walk through the change <span class="toggle" id="mode"><button data-m="one" class="on">One step at a time</button><button data-m="all">All steps</button></span></h2>
  <div class="tour">
    <div class="flowbox"><div class="flow" id="flow"></div>
      <div class="flowhelp">Click a step to open it. ← → or j k to move along. Dashed steps are side branches: related changes the story can be read without.</div>
    </div>
    <div id="steps"></div>
  </div>

  <h2>Risks and observations</h2>
  <div id="risks"></div>

  <h2>Changed files the walkthrough does not show</h2>
  <div id="uncovered"></div>
</div>
<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Paragraphs on blank lines, `code` in backticks; everything else as written.
  const prose = (s) => (s || '').split(/\n\s*\n/).filter((p) => p.trim()).map((p) =>
    '<p>' + esc(p.trim()).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>') + '</p>').join('');
  const inline = (s) => esc(s || '').replace(/`([^`]+)`/g, '<code>$1</code>');

  document.title = D.title + ' · walkthrough';
  $('title').textContent = D.title;
  $('meta').innerHTML = '<code>' + esc(D.branch || '(detached)') + '</code> against <code>' + esc(D.base) + '</code>' +
    (D.agent ? ' · written by ' + esc(D.agent) : '') + (D.time ? ' · ' + esc(D.time) : '');
  const high = D.risks.filter((r) => r.level === 'high').length;
  const tiles = [
    ['', D.stats.files, D.stats.files === 1 ? 'file changed' : 'files changed'],
    ['add', '+' + D.stats.add, 'lines added'],
    ['del', '−' + D.stats.del, 'lines removed'],
    ['', D.steps.length, D.steps.length === 1 ? 'step' : 'steps'],
    [high ? 'high' : '', D.risks.length, (D.risks.length === 1 ? 'risk' : 'risks') + (high ? ', ' + high + ' high' : '')],
  ];
  $('stats').innerHTML = tiles.map(([c, b, s]) => '<div class="stat ' + c + '"><b>' + esc(b) + '</b><span>' + esc(s) + '</span></div>').join('');
  $('summary').innerHTML = prose(D.summary);

  // --- the flow: main steps down the first column, each side step to the
  // right of the step it follows from.
  const W = 210, H = 66, GX = 44, GY = 26;
  const byId = {}, pos = {};
  D.steps.forEach((s, i) => { s.n = i + 1; byId[s.id] = s; });
  const taken = {};
  let mainRow = 0;
  D.steps.forEach((s) => {
    let col = 0, row;
    if (!s.side) {
      row = mainRow;
    } else {
      const p = pos[s.from[0]] || { col: 0, row: mainRow };
      col = p.col + 1; row = p.row;
      while (taken[col + ':' + row]) row++;
    }
    taken[col + ':' + row] = true;
    pos[s.id] = { col, row };
    if (!s.side) mainRow++;
  });
  let maxCol = 0, maxRow = 0;
  Object.values(pos).forEach((p) => { maxCol = Math.max(maxCol, p.col); maxRow = Math.max(maxRow, p.row); });
  const flow = $('flow');
  flow.style.width = ((maxCol + 1) * W + maxCol * GX) + 'px';
  flow.style.height = ((maxRow + 1) * H + maxRow * GY) + 'px';
  const xy = (id) => ({ x: pos[id].col * (W + GX), y: pos[id].row * (H + GY) });
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', flow.style.width); svg.setAttribute('height', flow.style.height);
  svg.innerHTML = '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>';
  svg.style.color = getComputedStyle(document.body).getPropertyValue('--muted');
  flow.appendChild(svg);
  const edges = [];
  D.steps.forEach((s) => s.from.forEach((f) => {
    if (!pos[f]) return;
    const a = xy(f), b = xy(s.id);
    let d;
    if (pos[f].col === pos[s.id].col) {
      const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y;
      if (pos[s.id].row === pos[f].row + 1) d = `M${x1},${y1} L${x2},${y2 - 2}`;
      else d = `M${a.x},${a.y + H / 2} C${a.x - 28},${a.y + H / 2} ${b.x - 28},${b.y + H / 2} ${b.x - 2},${b.y + H / 2}`;
    } else {
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
      const mx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}`;
    }
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge' + (s.side ? ' side' : ''));
    path.setAttribute('marker-end', 'url(#arr)');
    svg.appendChild(path);
    edges.push({ from: f, to: s.id, el: path });
  }));
  const nodes = {};
  D.steps.forEach((s) => {
    const p = xy(s.id), el = document.createElement('button');
    el.className = 'node' + (s.side ? ' side' : '');
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    const files = [...new Set(s.code.map((c) => c.file))];
    el.innerHTML = '<span class="n">' + s.n + '</span>' + esc(s.title) +
      (files.length ? '<small>' + esc(files.length === 1 ? files[0].split('/').pop() : files.length + ' files') + '</small>' : '');
    el.addEventListener('click', () => go(s.n - 1));
    flow.appendChild(el);
    nodes[s.id] = el;
  });

  // --- a step, and its code
  const num = (a, d) => (a ? '<span class="a">+' + a + '</span> ' : '') + (d ? '<span class="d">−' + d + '</span>' : '');
  function code(sn) {
    const f = D.order[sn.file] || {};
    let h = '<div class="code"><div class="codehead"><span class="path">' + esc(sn.file) + '</span>' +
      (f.role ? '<span class="role">' + esc(f.role) + (f.short ? ' — ' + esc(f.short) : '') + '</span>' : '') +
      '<span class="num">' + (sn.context ? 'not changed here' : num(f.add, f.del)) + '</span></div>';
    if (sn.note) h += '<div class="note">' + inline(sn.note) + '</div>';
    if (sn.missing) return h + '<div class="missing">' + esc(sn.missing) + '</div></div>';
    h += '<table class="diff">';
    sn.hunks.forEach((hk) => {
      h += '<tr class="h"><td class="ln"></td><td class="ln"></td><td class="s"></td><td class="c">' + esc(hk.header) + '</td></tr>';
      hk.lines.forEach((l) => {
        if (l.k === '~') { h += '<tr class="gap"><td class="ln"></td><td class="ln"></td><td class="s"></td><td class="c">⋯ ' + esc(l.t) + ' not shown — the whole file is in F1</td></tr>'; return; }
        if (l.why) h += '<tr class="why"><td></td><td></td><td></td><td>✎ ' + esc(l.why) + '</td></tr>';
        const cls = (l.k === '+' ? 'add' : l.k === '-' ? 'del' : '') + (l.mark ? ' mark' : '');
        h += '<tr class="' + cls + '"><td class="ln">' + (l.o || '') + '</td><td class="ln">' + (l.n || '') +
          '</td><td class="s">' + (l.k === ' ' ? '' : esc(l.k)) + '</td><td class="c">' + esc(l.t) + '</td></tr>';
      });
    });
    h += '</table>';
    if (sn.more) h += '<div class="more">' + sn.more + ' more ' + (sn.more === 1 ? 'hunk' : 'hunks') + ' in this file — read them in F1.</div>';
    return h + '</div>';
  }
  function stepHTML(s, withNav) {
    const i = s.n - 1;
    let h = '<section class="step" id="step-' + esc(s.id) + '"><div class="stephead">Step ' + s.n + ' of ' + D.steps.length +
      (s.side ? ' <span class="badge side">side branch</span>' : '') + '</div><h3>' + esc(s.title) + '</h3><div class="text">' + prose(s.text) + '</div>';
    const from = s.from.filter((f) => byId[f]);
    if (from.length) h += '<div class="follows">Follows from ' + from.map((f) => '<a data-go="' + (byId[f].n - 1) + '">' + byId[f].n + '. ' + esc(byId[f].title) + '</a>').join(', ') + '</div>';
    s.code.forEach((c) => { h += code(c); });
    if (!s.code.length) h += '<div class="missing">No code is pointed at in this step.</div>';
    if (withNav) {
      h += '<div class="nav"><button data-go="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + '>← Previous</button>' +
        '<button data-go="' + (i + 1) + '"' + (i === D.steps.length - 1 ? ' disabled' : '') + '>Next →</button><span class="grow"></span><kbd>← → · j k</kbd></div>';
    }
    return h + '</section>';
  }

  let cur = 0, mode = 'one';
  const seen = new Set();
  function draw() {
    const s = D.steps[cur];
    seen.add(s.id);
    Object.entries(nodes).forEach(([id, el]) => { el.classList.toggle('on', id === s.id); el.classList.toggle('seen', seen.has(id)); });
    edges.forEach((e) => e.el.classList.toggle('on', e.to === s.id));
    $('steps').innerHTML = mode === 'one' ? stepHTML(s, true) : D.steps.map((x) => stepHTML(x, false)).join('');
    if (mode === 'all') {
      const el = document.getElementById('step-' + s.id);
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }
  function go(i) {
    if (i < 0 || i >= D.steps.length) return;
    cur = i;
    history.replaceState(null, '', '#' + D.steps[i].id);
    draw();
    if (mode === 'one' && window.innerWidth > 900) {
      const top = $('steps').getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 16, behavior: 'smooth' });
    }
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go]');
    if (t && !t.disabled) go(+t.dataset.go);
    const m = e.target.closest('#mode button');
    if (m) {
      mode = m.dataset.m;
      document.querySelectorAll('#mode button').forEach((b) => b.classList.toggle('on', b === m));
      draw();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'j') { go(cur + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'k') { go(cur - 1); e.preventDefault(); }
  });
  const start = D.steps.findIndex((s) => '#' + s.id === location.hash);
  cur = start >= 0 ? start : 0;
  draw();

  // --- risks, and what the walkthrough leaves out
  $('risks').innerHTML = D.risks.length ? D.risks.map((r) => '<div class="risk ' + esc(r.level) + '"><div class="lvl">' + esc(r.level) + '</div><div class="text">' + prose(r.text) + '</div>' +
    (r.code ? '<details><summary>' + esc(r.code.file) + '</summary>' + code(r.code) + '</details>' : '') + '</div>').join('')
    : '<div class="empty">The agent noted no risks.</div>';
  $('uncovered').innerHTML = D.uncovered.length ? '<div class="files">' + D.uncovered.map((f) => '<div><span class="path">' + esc(f.file) + '</span><span class="role">' + esc(f.role || '') +
    '</span><span class="short">' + esc(f.short || '') + '</span><span class="num">' + num(f.add, f.del) + '</span></div>').join('') + '</div>'
    : '<div class="empty">None — every changed file is in a step.</div>';
})();
</script>
</body>
</html>
