id = "opencode"
version = "2026.10.13.1"
min_engine_version = 1
updated_at = "2026-10-13T00:00:00Z"
aliases = ["open-code", "herdr:opencode"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
# The title alone is not enough: it would also match a conversation that
# quotes it. The dialog's own footer ("esc reject" when asking, "esc
# cancel" when confirming an "always" choice) is what sets it apart.
any = [
  { contains = ["△ Permission required"], any = [{ contains = ["esc reject"] }, { contains = ["esc cancel"] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(2)"
visible_working = true
# The footer says "esc interrupt" (or "esc again to interrupt" once armed)
# the whole time opencode 2 is busy, thinking included, so it is the steady
# working signal. It is read from the footer only: a conversation that
# quotes the hint elsewhere must not count as work.
any = [
  { contains = ["esc interrupt"] },
  { contains = ["again to interrupt"] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
regex = ['(■|⬝){4,}']
