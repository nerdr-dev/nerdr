id = "copilot"
version = "2026.11.18.1"
min_engine_version = 1
updated_at = "2026-08-29T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

# Copilot 1.0.109 asks with "enter select · esc cancel", without the "to".
# Read at the bottom only: on the whole screen a conversation quoting the
# hint would be read as asking.
[[rules]]
id = "selection_blocker_enter_select"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(4)"
visible_blocker = true
all = [
  { contains = ["esc cancel"] },
  { contains = ["enter select"] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
# Its dot changes (◎, ●); copilot 1.0.98 shows ● while the screen is
# otherwise still, for longer than an interrupted turn.
line_regex = ['^\s*\S\s+Waiting for background agents(?:\s|·|$)']

# Copilot 1.0.107 and newer end the footer of a turn with "ctrl+c
# interrupt", not "esc esc interrupt".
[[rules]]
id = "ctrl_c_interrupt_working"
state = "working"
priority = 105
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["ctrl+c interrupt"]
not = [{ line_regex = ['^\s*\S\s+Waiting for background shells(?:\s|·|$)'] }]

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
# Its turn over, copilot waits on the shells it left running in the
# background, a dev server for ever: "esc esc interrupt" then stops those.
not = [{ line_regex = ['^\s*\S\s+Waiting for background shells(?:\s|·|$)'] }]
